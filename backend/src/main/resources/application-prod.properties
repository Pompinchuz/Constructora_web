# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN - RAILWAY
# ============================================

# Configuración del servidor
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - MYSQL RAILWAY
# ============================================
# Railway proporciona estas variables automáticamente cuando agregas MySQL

#spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/constructora_db}
#spring.datasource.username=${MYSQL_USER:root}
#spring.datasource.password=${MYSQL_PASSWORD:}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Pool de conexiones optimizado para producción
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
#sddd
# ============================================
# JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# CONFIGURACIÓN DE ARCHIVOS
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de uploads (Railway usa sistema de archivos efímero)
# Para producción deberías usar S3, Cloudinary u otro servicio
file.upload-dir=${UPLOAD_DIR:/app/uploads}

# ============================================
# CORS - Permitir tu dominio de Netlify
# ============================================
# Configura esto con tu URL de Netlify
cors.allowed-origins=${CORS_ORIGINS:https://constructora-ag-conferr.netlify.app}

# ============================================
# JWT CONFIGURACIÓN
# ============================================
# IMPORTANTE: Genera un secreto fuerte y único para producción
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================
# CONFIGURACIÓN DE EMAIL
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email del administrador
admin.email=${ADMIN_EMAIL:admin@constructora.com}

# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ============================================
app.name=${APP_NAME:Constructora}
app.url=${APP_URL:https://constructora-ag-conferr.netlify.app}

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.constructora.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# ============================================
# ACTUATOR (HEALTH CHECKS)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.server.port=${PORT:8080}